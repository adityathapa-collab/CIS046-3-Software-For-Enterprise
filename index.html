<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Game - Enterprise Software Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Enterprise App - Banana Puzzle</h2>

        <!-- login section for virtual identity -->
        <div id="login-div">
            <p>Enter your student name to login:</p>
            <input type="text" id="nameBox" placeholder="Username...">
            <br>
            <button id="loginBtn">Log In</button>
        </div>

        <!-- game section, hidden until logged in -->
        <div id="game-div" class="hidden">
            <p>Welcome, <span id="userText" style="color: green; font-weight: bold;"></span> | <a href="#" id="logoutLink">Logout</a> | <a href="admin.php" target="_blank">Admin Portal</a></p>
            
            <hr>
            <p>Solve this puzzle from external API:</p>
            <div id="imgContainer">
                <img id="puzzleImg" src="" alt="puzzle loading...">
            </div>

            <div>
                <input type="number" id="answerInput" placeholder="answer here">
                <br>
                <button id="submitBtn">Check Answer</button>
            </div>
            <p id="msg" style="font-weight: bold;"></p>
        </div>
    </div>

    <!-- linking separate frontend script -->
    <script src="app.js"></script>
</body>
</html>
